<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/fragments :: head('演示公告', null)}"></head>

<body>

<aside th:replace="~{common/fragments :: sidebar}"></aside>

<main class="main-wrapper">
    <header th:replace="~{common/fragments :: topbar}"></header>

    <div class="content-area">
        <div class="page-header">
            <div>
                <h1 class="page-title">演示公告</h1>
                <p class="page-subtitle">
                    通用 CRUD 的管理端页面。接口在 <code>/demo/notices</code>。
                </p>
            </div>
        </div>

        <form class="search-card" method="get" th:action="@{/admin/demo/notices}">
            <div class="form-group">
                <label>标题</label>
                <input type="text" name="title" class="form-control" placeholder="模糊搜索"
                       th:value="${param.title}">
            </div>
            <div class="form-group">
                <label>置顶</label>
                <select class="form-control" name="pinned">
                    <option value="">全部</option>
                    <option value="true" th:selected="${#strings.equals(param.pinned, 'true')}">置顶</option>
                    <option value="false" th:selected="${#strings.equals(param.pinned, 'false')}">未置顶</option>
                </select>
            </div>
            <input type="hidden" name="size" th:if="${param.size != null}" th:value="${param.size}">
            <div class="search-actions">
                <button type="submit" class="btn btn-primary" style="height: 40px;">
                    <i class='bx bx-search'></i> 查询
                </button>
                <a th:href="@{/admin/demo/notices}" class="btn btn-outline"
                   style="height: 40px; text-decoration: none; display: flex; align-items: center;">
                    <i class='bx bx-reset'></i> 重置
                </a>
            </div>
        </form>

        <div class="table-card">
            <div class="table-toolbar">
                <div class="table-toolbar-left">
                    <span style="font-size: 0.8rem; color: var(--text-muted);">
                        列表走分页查询。新增、修改、删除和置顶走接口。
                    </span>
                </div>
                <div>
                    <span style="font-size: 0.875rem; color: var(--text-muted);">
                        共查询到
                        <strong style="color: var(--text-main);" th:text="${noticesPageResult.count}">0</strong>
                        条
                    </span>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                    <tr>
                        <th>编号</th>
                        <th>标题</th>
                        <th>正文</th>
                        <th>置顶</th>
                        <th>创建时间</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(noticesPageResult.results)}">
                        <td colspan="5" style="text-align: center; padding: 40px 0; color: var(--text-muted);">
                            <i class='bx bx-news' style="font-size: 3rem; opacity: 0.5;"></i>
                            <p style="margin-top: 8px;">暂无公告，可通过 <code>POST /demo/notices</code> 创建</p>
                        </td>
                    </tr>
                    <tr th:each="row : ${noticesPageResult.results}">
                        <td th:text="${row.id}">1</td>
                        <td style="font-weight: 600;" th:text="${row.title}">标题</td>
                        <td style="color: var(--text-muted);"
                            th:text="${row.content != null ? (#strings.length(row.content) > 40 ? #strings.substring(row.content, 0, 40) + '…' : row.content) : '-'}">-</td>
                        <td>
                            <span th:if="${row.pinned}" class="badge badge-success">置顶</span>
                            <span th:if="${!row.pinned}" class="badge badge-info">普通</span>
                        </td>
                        <td style="color: var(--text-muted);"
                            th:text="${row.createdTime != null ? #temporals.format(row.createdTime, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <th:block th:replace="~{common/fragments :: adminPagination(${noticesPageResult}, '/admin/demo/notices')}"></th:block>
        </div>
    </div>
</main>

<div th:replace="~{common/fragments :: common_modals}"></div>
<div th:replace="~{common/fragments :: common_scripts}"></div>
</body>
</html>
