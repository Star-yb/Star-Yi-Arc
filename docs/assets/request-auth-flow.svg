  <path d="M355 230 V450" fill="none" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M550 500 H650" fill="none" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="750" y="610" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18" fill="#64748B">登录页面 Cookie，设备 admin-web；接口使用请求头 satoken，设备 api。两套会话互不干扰。</text>
