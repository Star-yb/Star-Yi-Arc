    <text x="125" y="166" font-size="22" font-weight="700" fill="#1E3A8A">Browser</text>
    <text x="125" y="198" font-size="15" fill="#64748B">管理页 / REST</text>
    <rect x="270" y="110" width="170" height="120" rx="18" fill="#F8FAFC" stroke="#3B5BDB" stroke-width="2"/>
    <text x="355" y="166" font-size="22" font-weight="700" fill="#1E3A8A">Sa-Token</text>
    <text x="355" y="198" font-size="15" fill="#64748B">按路径分流</text>
    <rect x="500" y="110" width="190" height="120" rx="18" fill="#F8FAFC" stroke="#3B5BDB" stroke-width="2"/>
    <text x="595" y="166" font-size="22" font-weight="700" fill="#1E3A8A">Controller</text>
    <text x="595" y="198" font-size="15" fill="#64748B">页面或接口</text>
    <rect x="760" y="110" width="250" height="120" rx="18" fill="#F8FAFC" stroke="#3B5BDB" stroke-width="2"/>
    <text x="885" y="166" font-size="22" font-weight="700" fill="#1E3A8A">Service / Dao</text>
