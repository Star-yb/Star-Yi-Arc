    <rect x="1310" y="110" width="150" height="120" rx="18" fill="#EEF2FF" stroke="#3B5BDB" stroke-width="2"/>
    <text x="1385" y="178" font-size="20" font-weight="700" fill="#1E3A8A">MySQL</text>
