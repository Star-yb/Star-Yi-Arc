  <rect x="760" y="280" width="320" height="100" rx="18" fill="#EEF2FF" stroke="#3B5BDB" stroke-width="2"/>
  <text x="920" y="322" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">JimmerCrudResource</text>
  <text x="920" y="354" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16" fill="#64748B">标准资源的注解式 CRUD</text>
  <path d="M595 230 V330 H760" fill="none" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M1080 330 H1165 V230" fill="none" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arr)"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">
    <rect x="270" y="450" width="280" height="100" rx="18" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="2"/>
    <text x="410" y="492" font-size="22" font-weight="700" fill="#1E3A8A">StpInterfaceImpl</text>
