  <g fill="none" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arr)">
    <path d="M210 170 H270"/>
    <path d="M440 170 H500"/>
    <path d="M690 170 H760"/>
    <path d="M1010 170 H1080"/>
    <path d="M1250 170 H1310"/>
