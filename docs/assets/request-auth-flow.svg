    <rect x="1080" y="110" width="170" height="120" rx="18" fill="#F8FAFC" stroke="#3B5BDB" stroke-width="2"/>
    <text x="1165" y="166" font-size="22" font-weight="700" fill="#1E3A8A">Jimmer</text>
