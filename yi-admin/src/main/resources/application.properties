# yi-admin 本地开发配置。库模块不要再放一份同名文件，否则会盖住这里的值。
# 账号、密码、JWT 密钥都是本机示例，部署前请换成环境自己的值。

# ---------- 服务 ----------
# 与 Star-Yi 相同的端口，管理端为 http://localhost:8500/admin/login
server.port=8500
# 应用上下文路径。/ 表示不额外加前缀。
server.servlet.context-path=/
# 只用 Cookie 维持会话，避免地址栏出现 ;jsessionid= 后被 Sa-Token 拦截。
server.servlet.session.tracking-modes=cookie
# Tomcat 允许的表单 POST 体积，以及连接被放弃时继续吞掉的最大体积。
server.tomcat.max-http-form-post-size=24MB
server.tomcat.max-swallow-size=24MB

# ---------- Spring ----------
# 应用名，日志和启动信息里会显示。
spring.application.name=yi-admin
# 单个上传文件上限，以及整次请求（可含多个文件）的上限。
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
# 静态资源和模板的查找位置。
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/
# 视图名前面的路径、后面的后缀。Controller 返回 "sys/user" 时对应 /sys/user.html。
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.html
# 静态资源的 URL 前缀。
spring.mvc.static-path-pattern=/static/**
# 关闭模板缓存，改完 HTML 不用重启。依赖需为 implementation 后才会生效。
spring.thymeleaf.cache=false
# 管理端模板目录。业务模块自己的页面放在 classpath:/admin/，由代码额外注册。
spring.thymeleaf.prefix=classpath:/templates/

# ---------- 数据库（默认 MySQL） ----------
# 先建库 star_yi，再执行 sql/mysql.sql。
# 改用 PostgreSQL：注释掉下面 MySQL 四行，改用再下面的 PostgreSQL 四行，
# 把 jimmer.dialect 改成 PostgresDialect，并执行 sql/pgsql.sql。
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/xxx?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# 使用 Druid 连接池。当前 starter 面向旧版 Spring Boot，若启动后没有建池，再改连接池实现。
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

# ---------- Redis ----------
# Sa-Token 会话，以及角色、权限缓存。库索引 1，避免占用默认的 0 号库。
spring.data.redis.database=1
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=123456
spring.data.redis.timeout=10s
# Lettuce 连接池。max-wait 为负表示获取连接时不限制等待时间。
spring.data.redis.lettuce.pool.max-active=200
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=0

# ---------- 日志 ----------
# 压低 Spring Boot 自动配置的日志，避免启动时刷屏。
logging.level.org.springframework.boot.autoconfigure=error

# ---------- Sa-Token ----------
# 请求头和 Cookie 里的令牌名。
sa-token.token-name=satoken
# 令牌有效期，单位秒。86400 为一天，-1 为永久。
sa-token.timeout=86400
# 超过该空闲时间则冻结。-1 表示不冻结。
sa-token.active-timeout=-1
# 同一账号允许多处同时登录。
sa-token.is-concurrent=true
# 每次登录单独发令牌，一处退出不影响其他端。
sa-token.is-share=false
# 令牌样式。
sa-token.token-style=uuid
# 打印 Sa-Token 操作日志。
sa-token.is-log=true
# JWT 签名密钥。生产环境必须更换，且不要提交真实密钥。
sa-token.jwt-secret-key=asdasdasifhueuiwyurfewbfjsdafjk

# ---------- OpenAPI / Swagger ----------
# 是否提供 OpenAPI JSON，以及它的路径。
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
# Swagger UI 入口。鉴权放行要在 Sa-Token 配置里单独写。
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# 文档里的分组和接口按名称排序。
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# 扫描该包下的接口。业务模块也要放在 com.star 下才会出现在文档里。
springdoc.packages-to-scan=com.star
# 不把 Actuator 端点写进接口文档。
springdoc.show-actuator=false

# ---------- Jimmer ----------
# kotlin 才会注册 KSqlClient。不写这项时只注册 Java 的 JSqlClient。
jimmer.language=kotlin
# 默认 MySQL。改用 PostgreSQL 时换成 org.babyfish.jimmer.sql.dialect.PostgresDialect。
jimmer.dialect=org.babyfish.jimmer.sql.dialect.MySqlDialect
# 打印实际执行的 SQL，并做换行排版。
jimmer.show-sql=true
jimmer.pretty-sql=true
# 启动时对照实体检查表结构。表还没建时会启动失败，先执行 sql/mysql.sql。
jimmer.database-validation-mode=ERROR
# 关联对象抓取、列表抓取时的默认批量大小。
jimmer.default-batch-size=256
jimmer.default-list-batch-size=32
# 实体上未声明的外键默认不由 Jimmer 建真实外键。
jimmer.is-foreign-key-enabled-by-default=false
